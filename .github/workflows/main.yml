name: Build & Release QBIV

on:
  push:
    tags:
      - "v*"  # Runs on tag like v1.0.0, v1.0.1, etc.

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      AI_API_BASE: ${{ secrets.AI_API_BASE }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }} # required for electron-builder publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build app (tsc + Vite + Electron Builder)
        run: npm run build

      - name: Upload artifacts to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*.dmg
            dist/**/*Setup*.exe
            dist/**/*.AppImage
            dist/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
